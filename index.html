    <script>
      // Gracefully filter benign Vite HMR websocket connection notifications in container preview
      (function() {
        const _origConsoleError = console.error;
        console.error = function(...args) {
          const first = args[0];
          if (
            (typeof first === 'string' && (
              first === '[vite]' ||
              first.startsWith('[vite]') ||
              first.includes('failed to connect to websocket')
            )) ||
            (args.length > 1 && typeof first === 'string' && first.includes('[vite]'))
          ) {
            console.debug(...args);
            return;
          }
          _origConsoleError.apply(console, args);
        };
      })();
    </script>
